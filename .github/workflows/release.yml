name: Build and Publish Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'V*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish StarPie Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to latest main commit
        shell: pwsh
        run: |
          git fetch origin main

          $tagCommit = (git rev-list -n 1 $env:GITHUB_REF_NAME).Trim()
          $mainCommit = (git rev-parse origin/main).Trim()

          if ($tagCommit -ne $mainCommit) {
            throw "Release tag must point to the latest origin/main commit. Tag=$tagCommit Main=$mainCommit"
          }

          Write-Host "Verified release commit: $tagCommit"

      - name: Verify compiled version fields
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -inotmatch '^v(?<baseVersion>\d+\.\d+\.\d+)(?<prerelease>-beta\.\d+)?$') {
            throw "Release tag must use vX.Y.Z/VX.Y.Z or vX.Y.Z-beta.N/VX.Y.Z-beta.N format: $tag"
          }

          $baseVersion = $Matches.baseVersion
          [xml]$project = Get-Content "WinPieGestures/WinPieGestures.csproj"

          $projectVersion = [string]$project.Project.PropertyGroup.Version
          $assemblyVersion = [string]$project.Project.PropertyGroup.AssemblyVersion
          $fileVersion = [string]$project.Project.PropertyGroup.FileVersion

          function Get-ThreePartVersion([string]$value, [string]$fieldName) {
            if ($value -notmatch '^(?<baseVersion>\d+\.\d+\.\d+)(?:[.+-].*)?$') {
              throw "$fieldName must start with a three-part numeric version: $value"
            }

            return $Matches.baseVersion
          }

          $versionFields = @(
            @{ Name = "Version"; Value = $projectVersion }
            @{ Name = "AssemblyVersion"; Value = $assemblyVersion }
            @{ Name = "FileVersion"; Value = $fileVersion }
          )

          foreach ($field in $versionFields) {
            $fieldBaseVersion = Get-ThreePartVersion $field.Value $field.Name
            if ($fieldBaseVersion -ne $baseVersion) {
              throw "$($field.Name) mismatch: tag base=$baseVersion actual=$($field.Value)"
            }
          }

          Write-Host "Verified matching three-part version ${baseVersion}: Version=$projectVersion AssemblyVersion=$assemblyVersion FileVersion=$fileVersion"

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore WinPieGestures/WinPieGestures.csproj -r win-x64

      - name: Build Release
        run: dotnet build WinPieGestures/WinPieGestures.csproj -c Release --no-restore

      - name: Publish Lightweight package
        run: >
          dotnet publish WinPieGestures/WinPieGestures.csproj
          -c Release
          -r win-x64
          --no-self-contained
          --no-restore
          -o publish/Lightweight

      - name: Publish Standalone package
        run: >
          dotnet publish WinPieGestures/WinPieGestures.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/Standalone

      - name: Package release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null

          $lightweightArchive = "dist/StarPie-$tag-Lightweight-win-x64.zip"
          $standaloneArchive = "dist/StarPie-$tag-Standalone-win-x64.zip"

          Compress-Archive -Path "publish/Lightweight/*" -DestinationPath $lightweightArchive -Force
          Compress-Archive -Path "publish/Standalone/*" -DestinationPath $standaloneArchive -Force

          $checksums = Get-ChildItem "dist/*.zip" | Sort-Object Name | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($_.Name)"
          }
          $checksums | Set-Content "dist/SHA256SUMS.txt" -Encoding utf8

          if (-not (Test-Path "publish/Lightweight/StarPie.exe")) {
            throw "Lightweight package does not contain StarPie.exe"
          }
          if (-not (Test-Path "publish/Standalone/StarPie.exe")) {
            throw "Standalone package does not contain StarPie.exe"
          }

      - name: Extract Release Notes from CHANGELOG.md
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagClean = $tag.TrimStart('v', 'V')
          $changelogPath = "CHANGELOG.md"
          $notes = ""

          if (Test-Path $changelogPath) {
            $content = Get-Content $changelogPath -Raw -Encoding utf8
            # 优先匹配当前 Tag: ## [vX.Y.Z-beta.N] 或 ## [vX.Y.Z]
            $pattern = "(?s)##\s*\[[vV]?$([regex]::Escape($tagClean))\][^\r\n]*\r?\n(.*?)(?=\r?\n##\s*\[|\Z)"
            if ($content -match $pattern) {
              $notes = $Matches[1].Trim()
            }
            # 若未匹配到，提取顶部第一个版本段落
            if ([string]::IsNullOrWhiteSpace($notes)) {
              $firstPattern = "(?s)##\s*\[[vV]?[^\]]+\][^\r\n]*\r?\n(.*?)(?=\r?\n##\s*\[|\Z)"
              if ($content -match $firstPattern) {
                $notes = $Matches[1].Trim()
              }
            }
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $notesFile = "dist/RELEASE_NOTES.md"
          if (-not [string]::IsNullOrWhiteSpace($notes)) {
            $notes | Set-Content $notesFile -Encoding utf8
            Write-Host "Successfully extracted release notes from CHANGELOG.md for $tag"
          } else {
            "StarPie $tag" | Set-Content $notesFile -Encoding utf8
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem "dist/*.zip", "dist/SHA256SUMS.txt" |
            Sort-Object Name |
            Select-Object -ExpandProperty FullName

          $releaseArguments = @("release", "create", $env:GITHUB_REF_NAME)
          $releaseArguments += $assets
          $releaseArguments += @("--verify-tag", "--title", "StarPie $env:GITHUB_REF_NAME")

          $notesFile = "dist/RELEASE_NOTES.md"
          if (Test-Path $notesFile) {
            $releaseArguments += @("--notes-file", $notesFile)
          } else {
            $releaseArguments += @("--notes", "StarPie $env:GITHUB_REF_NAME")
          }

          if ($env:GITHUB_REF_NAME -imatch '^v\d+\.\d+\.\d+-beta\.\d+$') {
            $releaseArguments += "--prerelease"
            Write-Host "Publishing GitHub pre-release: $env:GITHUB_REF_NAME"
          }

          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed with exit code $LASTEXITCODE"
          }

      - name: Retain latest three beta releases
        if: ${{ contains(github.ref_name, '-beta.') }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ($env:GITHUB_REF_NAME -inotmatch '^v(?<baseVersion>\d+\.\d+\.\d+)-beta\.\d+$') {
            throw "Unexpected beta tag format: $env:GITHUB_REF_NAME"
          }

          $baseVersion = $Matches.baseVersion
          $betaPattern = "^v$([regex]::Escape($baseVersion))-beta\.(?<number>\d+)$"
          $releaseJson = (& gh release list --repo $env:GH_REPO --limit 1000 --json tagName,isDraft,isPrerelease | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to list GitHub releases (exit code $LASTEXITCODE)"
          }

          $releases = @($releaseJson | ConvertFrom-Json)
          $betaReleases = [System.Collections.Generic.List[object]]::new()

          foreach ($release in $releases) {
            if ($release.isDraft -or -not $release.isPrerelease) {
              continue
            }

            $betaMatch = [regex]::Match($release.tagName, $betaPattern, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if ($betaMatch.Success) {
              $betaReleases.Add([pscustomobject]@{
                TagName = $release.tagName
                Number = [long]$betaMatch.Groups['number'].Value
              })
            }
          }

          $orderedBetas = @($betaReleases | Sort-Object Number -Descending)
          $retainedBetas = @($orderedBetas | Select-Object -First 3)
          $expiredBetas = @($orderedBetas | Select-Object -Skip 3)

          Write-Host "Retaining beta releases: $($retainedBetas.TagName -join ', ')"
          if ($expiredBetas.Count -eq 0) {
            Write-Host "No superseded beta releases need to be deleted."
            exit 0
          }

          $failures = [System.Collections.Generic.List[string]]::new()
          foreach ($beta in $expiredBetas) {
            Write-Host "Deleting beta release $($beta.TagName); Git tag will be retained."
            & gh release delete $beta.TagName --repo $env:GH_REPO --yes
            if ($LASTEXITCODE -ne 0) {
              $failures.Add($beta.TagName)
            }
          }

          if ($failures.Count -gt 0) {
            throw "Failed to delete beta releases: $($failures -join ', ')"
          }
